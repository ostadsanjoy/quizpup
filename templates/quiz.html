{% extends 'base.html' %}
{% block content %}
<div id="quiz-workspace" class="p-5 space-y-6">
    <div class="bg-[#D7BEA8] border border-[#B49286] p-4 rounded-2xl shadow-sm space-y-3">
        <div class="flex justify-between items-center">
            <div>
                <h3 class="text-lg font-serif font-bold text-[#744253]">{{ session.topic }}</h3>
                <span id="hint-status-label" class="text-xs text-[#744253]/80 font-semibold uppercase"></span>
            </div>
            <div class="text-right">
                <div id="clock-display" class="text-xl font-mono font-bold text-[#744253]">00:00</div>
            </div>
        </div>
        <div class="flex justify-between items-center pt-2.5 border-t border-[#B49286]/30">
            <button id="quitExamBtn" onclick="quitExam()" class="px-3.5 py-1.5 bg-[#F3D9DC] text-[#744253] border border-[#B49286] rounded-xl text-xs font-semibold hover:bg-[#EBC4C8] transition cursor-pointer">Quit Exam</button>
            <button id="headerSubmitBtn" onclick="confirmAndSubmitQuiz()" class="btn-primary px-4 py-1.5 rounded-xl text-xs font-semibold cursor-pointer">Submit</button>
        </div>
    </div>

    <div id="questionCard" class="bg-white border border-[#B49286] p-6 rounded-3xl shadow-sm">
        <div id="question-header" class="text-sm font-bold text-[#C78283] mb-2 uppercase tracking-wide"></div>
        <p id="question-body-text" class="text-base text-[#744253] font-semibold mb-6"></p>
        
        <div id="options-box" class="space-y-2.5"></div>
        
        <div id="feedback-explanation-panel" class="mt-6 p-4 bg-[#F3D9DC] border border-[#B49286] rounded-2xl hidden">
            <h5 class="text-xs font-bold text-[#744253] uppercase mb-1">Explanation After Attempt</h5>
            <p id="explanation-text-string" class="text-sm text-[#744253] leading-relaxed"></p>
        </div>
    </div>

    <div class="flex justify-between items-center">
        <button id="prevBtn" onclick="moveSlide(-1)" class="px-4 py-2 bg-[#F3D9DC] text-[#744253] border border-[#B49286] rounded-xl text-sm font-semibold hover:bg-[#EBC4C8] disabled:opacity-50 cursor-pointer">Previous</button>
        <div class="flex gap-2">
            <button id="clearBtn" onclick="clearCurrentChoice()" class="px-4 py-2 border border-[#B49286] text-[#744253] rounded-xl text-sm font-medium hover:bg-[#F3D9DC]/40 cursor-pointer">Clear Answer</button>
            <button id="hintTriggerBtn" onclick="requestHintPayload()" class="btn-accent px-4 py-2 rounded-xl text-sm font-semibold shadow-sm hidden cursor-pointer">Hint</button>
        </div>
        <button id="nextBtn" onclick="moveSlide(1)" class="btn-primary px-4 py-2 rounded-xl text-sm font-semibold shadow-sm cursor-pointer">Next</button>
    </div>
</div>

<div id="analytics-report-card" class="hidden space-y-6 bg-white border border-[#B49286] p-6 rounded-3xl shadow-sm m-5">
    <h3 class="text-2xl font-serif font-bold text-[#744253] reveal-in">Quiz Summary Report</h3>
    <p class="text-lg font-semibold text-[#744253] reveal-in">Total Score: <span id="score-data-val" class="font-black text-[#C78283] text-2xl font-mono"></span></p>
    
    <div class="p-4 bg-[#F3D9DC] border border-[#B49286] rounded-2xl reveal-in reveal-in-delay">
        <h4 class="text-xs font-bold text-[#744253] uppercase mb-1">Improvement Suggestions</h4>
        <p id="recommendation-box-string" class="text-sm text-[#744253] leading-relaxed"></p>
    </div>
    
    <div class="flex flex-col sm:flex-row gap-3 pt-2 reveal-in reveal-in-delay">
        <button onclick="revealExplanationsWorkflow()" class="btn-accent flex-1 font-semibold py-3 px-4 rounded-2xl text-sm shadow-sm cursor-pointer text-center">Review Answers & Explanations</button>
        <a href="/home" class="btn-primary flex-1 font-semibold py-3 px-4 rounded-2xl text-sm shadow-sm cursor-pointer text-center flex items-center justify-center gap-2">Go to Home</a>
    </div>
</div>


<script nonce="{{ csp_nonce() }}">
let questionDeck = [];
let cursor = 0;
let savedAnswers = {};
let secondsLeft = 0;
let clockLoop;
let reviewMode = false;
let globalExplanations = {};

function revealResultsCard() {
    const card = document.getElementById('analytics-report-card');
    document.getElementById('quiz-workspace').classList.add('hidden');
    card.classList.remove('hidden');
    const nodes = card.querySelectorAll('.reveal-in');
    nodes.forEach(n => n.classList.remove('reveal-in-active'));
    // Double rAF: let the browser paint the opacity:0 start state first,
    // otherwise the transition to reveal-in-active can get coalesced away.
    requestAnimationFrame(() => {
        requestAnimationFrame(() => {
            nodes.forEach(n => n.classList.add('reveal-in-active'));
        });
    });
}

async function startEngine() {
    const res = await fetch('/api/quiz/{{ session.id }}/questions');
    const data = await res.json();
    questionDeck = data.questions;
    savedAnswers = data.saved_answers || {};
    
    if (data.is_completed) {
        reviewMode = true;
        globalExplanations = data.explanations;
        
        document.getElementById('score-data-val').innerText = `${data.score} / ${data.total}`;
        document.getElementById('recommendation-box-string').innerText = data.recommendation;
        revealResultsCard();
    } else {
        secondsLeft = data.seconds_remaining !== undefined ? data.seconds_remaining : (data.duration * 60);
        configureHintsIndicator(data.difficulty, data.hints_remaining);
        beginClock();
        showQuestion();
    }
}

async function saveProgress() {
    if (reviewMode) return;
    try {
        await fetch('/api/quiz/{{ session.id }}/save-progress', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                answers: savedAnswers,
                seconds_remaining: secondsLeft
            })
        });
    } catch(e) {
        console.warn('Progress save failed:', e);
    }
}

window.addEventListener('beforeunload', () => {
    if (!reviewMode && questionDeck.length) {
        const payload = JSON.stringify({ answers: savedAnswers, seconds_remaining: secondsLeft });
        const blob = new Blob([payload], { type: 'application/json' });
        navigator.sendBeacon('/api/quiz/{{ session.id }}/save-progress', blob);
    }
});

function configureHintsIndicator(mode, total) {
    const lbl = document.getElementById('hint-status-label');
    const btn = document.getElementById('hintTriggerBtn');
    if(mode === 'easy') { lbl.innerText = "Hints: Unlimited"; btn.classList.remove('hidden'); }
    else if(mode === 'medium') { lbl.innerText = `Hints Left: ${total}`; btn.classList.remove('hidden'); }
    else { lbl.innerText = `Hints Disabled (${mode})`; btn.style.display = 'none'; }
}

function showQuestion() {
    if(!questionDeck.length) return;
    const item = questionDeck[cursor];
    
    document.getElementById('question-header').innerText = `Question ${cursor + 1} of ${questionDeck.length}`;
    document.getElementById('question-body-text').innerText = item.question;
    
    let container = document.getElementById('options-box');
    container.innerHTML = '';
    
    ['1', '2', '3', '4'].forEach(indexId => {
        let isUserChoice = savedAnswers[item.id] == indexId;
        let selectedState = isUserChoice ? 'checked' : '';
        let disabledState = reviewMode ? 'disabled' : '';
        let row = document.createElement('label');
        let classString = "flex items-center justify-between p-3 border rounded-lg cursor-pointer text-sm transition font-medium relative ";
        let badgeHtml = "";
        
        if (reviewMode) {
            let correctOptionIndex = globalExplanations[item.id]?.correct;
            let isCorrectChoice = indexId == correctOptionIndex;
            
            if (isCorrectChoice) {
                classString += "border-emerald-500 bg-emerald-50/60 text-emerald-900";
                badgeHtml = '<span class="bg-emerald-600 text-white text-[10px] uppercase font-bold px-2 py-0.5 rounded shadow-sm">Correct</span>';
            } else if (isUserChoice && !isCorrectChoice) {
                classString += "border-rose-500 bg-rose-50/60 text-rose-900";
                badgeHtml = '<span class="bg-rose-600 text-white text-[10px] uppercase font-bold px-2 py-0.5 rounded shadow-sm">Wrong</span>';
            } else {
                classString += "border-slate-200 opacity-60";
            }
        } else {
            // Live active testing states
            classString += isUserChoice ? 'border-[#C78283] bg-[#F3D9DC] text-[#744253] font-bold shadow-xs' : 'border-[#B49286]/30 text-[#744253] hover:bg-[#F3D9DC]/30';
        }
        
        row.className = classString;
        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = String(str);
            return div.innerHTML;
        }

        row.innerHTML = `
            <div class="flex items-center gap-3">
                <input type="radio" name="opts-${item.id}" value="${indexId}" ${selectedState} ${disabledState} onchange="logSelection(${item.id}, ${indexId})" class="h-4 w-4 accent-[#744253]">
                <span>${indexId}. ${escapeHtml(item[indexId])}</span>
            </div>
            ${badgeHtml}
        `;

        container.appendChild(row);
    });

    document.getElementById('prevBtn').disabled = cursor === 0;
    document.getElementById('nextBtn').innerText = cursor === questionDeck.length - 1 ? (reviewMode ? "Exit" : "Submit") : "Next";
    
    if (reviewMode) {
        const submitBtn = document.getElementById('headerSubmitBtn');
        if (submitBtn) submitBtn.style.display = 'none';
        const quitBtn = document.getElementById('quitExamBtn');
        if (quitBtn) quitBtn.innerText = 'Exit Review';
    }

    const expPanel = document.getElementById('feedback-explanation-panel');
    if(reviewMode && globalExplanations[item.id]) {
        expPanel.classList.remove('hidden');
        document.getElementById('explanation-text-string').innerText = globalExplanations[item.id].explanation;
    } else {
        expPanel.classList.add('hidden');
    }
}

async function quitExam() {
    if (reviewMode) {
        window.location.href = '/home';
        return;
    }
    if (confirm("Are you sure you want to quit the exam? Your marked answers and remaining time will be saved.")) {
        await saveProgress();
        window.location.href = '/home';
    }
}

function confirmAndSubmitQuiz() {
    if (confirm("Are you sure you want to submit your quiz?")) {
        completeQuizSession();
    }
}


function logSelection(qId, idx) { 
    if(reviewMode) return;
    savedAnswers[qId] = idx; 
    showQuestion();
    saveProgress();
}

function clearCurrentChoice() {
    if(reviewMode) return;
    const item = questionDeck[cursor];
    delete savedAnswers[item.id];
    showQuestion();
    saveProgress();
}

function moveSlide(offset) {
    if(offset === 1 && cursor === questionDeck.length - 1) { 
        if(reviewMode) { window.location.href = '/home'; } else { completeQuizSession(); }
        return; 
    }
    cursor += offset;
    // Fast, subtle crossfade — this fires many times per session, so it must
    // read as instant, not as a transition. Answer-selection re-renders
    // (logSelection/clearCurrentChoice) intentionally skip this and stay sync.
    const card = document.getElementById('questionCard');
    card.classList.add('fade-fast', 'fade-fast-out');
    setTimeout(() => {
        showQuestion();
        card.classList.remove('fade-fast-out');
    }, 120);
}

async function requestHintPayload() {
    const item = questionDeck[cursor];
    const res = await fetch(`/api/quiz/{{ session.id }}/hint/${item.id}`, { method: 'POST' });
    const data = await res.json();
    if(data.hint) { alert("Hint Details: " + data.hint); if(data.hints_remaining!==undefined) configureHintsIndicator('medium', data.hints_remaining); }
    else { alert(data.error); }
}

function beginClock() {
    const view = document.getElementById('clock-display');
    clockLoop = setInterval(() => {
        if(secondsLeft <= 0) { clearInterval(clockLoop); completeQuizSession(); return; }
        secondsLeft--;
        let m = Math.floor(secondsLeft / 60).toString().padStart(2, '0');
        let s = (secondsLeft % 60).toString().padStart(2, '0');
        view.innerText = `${m}:${s}`;
        
        if (secondsLeft % 5 === 0) {
            saveProgress();
        }
    }, 1000);
}


async function completeQuizSession() {
    clearInterval(clockLoop);
    const res = await fetch('/api/quiz/{{ session.id }}/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ answers: savedAnswers })
    });
    const data = await res.json();
    globalExplanations = data.explanations;
    
    document.getElementById('score-data-val').innerText = `${data.score} / ${data.total}`;
    document.getElementById('recommendation-box-string').innerText = data.recommendation;
    revealResultsCard();
}

function revealExplanationsWorkflow() {
    document.getElementById('analytics-report-card').classList.add('hidden');
    document.getElementById('quiz-workspace').classList.remove('hidden');
    reviewMode = true;
    cursor = 0;
    showQuestion();
}

window.onload = startEngine;
</script>
{% endblock %}
